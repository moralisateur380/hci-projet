---
# ============ PLAY 1 : socle commun, reseau, KVM ============
- name: Socle commun, rÃ©seau et KVM
  hosts: hci
  become: true
  tags: [base]
  tasks:
    - name: Nom d'hÃ´te
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: RÃ©solution de noms du cluster
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} HCI CLUSTER"
        block: |
          {% for h, v in cluster.items() %}
          {{ v.priv }} {{ h }}
          {{ v.priv }} {{ h }}-st
          {% endfor %}

    - name: sudo sans mot de passe pour hci (laboratoire)
      ansible.builtin.copy:
        dest: /etc/sudoers.d/hci
        content: "hci ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: visudo -cf %s

    - name: Paquets de base, KVM/libvirt et Gluster
      ansible.builtin.apt:
        update_cache: true
        name:
          - qemu-system-x86
          - libvirt-daemon-system
          - libvirt-clients
          - virtinst
          - qemu-utils
          - cloud-image-utils
          - bridge-utils
          - netcat-openbsd
          - cpu-checker
          - glusterfs-server
          - xfsprogs

    - name: hci dans les groupes libvirt et kvm
      ansible.builtin.user:
        name: hci
        groups: libvirt,kvm
        append: true

    - name: Dossier .ssh de hci
      ansible.builtin.file:
        path: /home/hci/.ssh
        state: directory
        owner: hci
        group: hci
        mode: "0700"

    - name: ClÃ© privÃ©e de cluster
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/hci_id_ed25519"
        dest: /home/hci/.ssh/id_ed25519
        owner: hci
        group: hci
        mode: "0600"

    - name: ClÃ© publique de cluster autorisÃ©e
      ansible.posix.authorized_key:
        user: hci
        key: "{{ lookup('file', playbook_dir + '/files/hci_id_ed25519.pub') }}"

    - name: Config SSH client
      ansible.builtin.copy:
        dest: /home/hci/.ssh/config
        content: |
          Host hci*
              StrictHostKeyChecking accept-new
        owner: hci
        group: hci
        mode: "0600"

    - name: VÃ©rifier que /dev/kvm existe
      ansible.builtin.stat:
        path: /dev/kvm
      register: kvm_dev

    - name: ArrÃªt si la virtualisation imbriquÃ©e est absente
      ansible.builtin.assert:
        that: kvm_dev.stat.exists
        fail_msg: "/dev/kvm absent : nested non actif sur pve ou CPU de la VM pas en host"

    - name: libvirtd actif
      ansible.builtin.systemd:
        name: libvirtd
        enabled: true
        state: started

    - name: EmpÃªcher cloud-init de rÃ©Ã©crire le rÃ©seau
      ansible.builtin.copy:
        dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
        content: "network: {config: disabled}\n"

    - name: Sauvegarder les anciens fichiers netplan
      ansible.builtin.shell: |
        mkdir -p /root/netplan-bak
        for f in /etc/netplan/*.yaml; do
          [ -e "$f" ] || continue
          [ "$f" = /etc/netplan/60-hci.yaml ] || mv "$f" /root/netplan-bak/
        done
      args:
        creates: /etc/netplan/60-hci.yaml

    - name: DÃ©ployer la configuration netplan (bridge br0)
      ansible.builtin.template:
        src: templates/netplan.yaml.j2
        dest: /etc/netplan/60-hci.yaml
        mode: "0600"
      register: netplan_cfg

    - name: Appliquer netplan (dÃ©tachÃ©)
      ansible.builtin.shell: netplan generate && sleep 2 && netplan apply
      async: 45
      poll: 0
      when: netplan_cfg.changed

    - name: Attendre le retour du nÅ“ud
      ansible.builtin.wait_for_connection:
        delay: 8
        timeout: 90
      when: netplan_cfg.changed

    - name: VÃ©rifier que br0 est actif
      ansible.builtin.command: ip -br addr show br0
      register: br0
      changed_when: false
      failed_when: cluster[inventory_hostname].vm not in br0.stdout

# ============ PLAY 2 : briques Gluster ============
- name: PrÃ©parer la brique de stockage
  hosts: hci
  become: true
  tags: [gluster]
  tasks:
    - name: glusterd actif
      ansible.builtin.systemd:
        name: glusterd
        enabled: true
        state: started

    - name: Formater le disque de brique en XFS
      community.general.filesystem:
        fstype: xfs
        dev: "{{ brick_dev }}"
        opts: -i size=512

    - name: UUID du disque de brique
      ansible.builtin.command: blkid -s UUID -o value {{ brick_dev }}
      register: brick_uuid
      changed_when: false

    - name: Monter la brique (fstab)
      ansible.posix.mount:
        path: "{{ brick_mount }}"
        src: "UUID={{ brick_uuid.stdout }}"
        fstype: xfs
        state: mounted

    - name: Dossier de brique
      ansible.builtin.file:
        path: "{{ brick_mount }}/{{ gluster_volume }}"
        state: directory

# ============ PLAY 3 : cluster Gluster et volume (depuis hci1) ============
- name: CrÃ©er le cluster et le volume rÃ©pliquÃ©
  hosts: hci1
  become: true
  tags: [gluster]
  tasks:
    - name: Ajouter hci2 et hci3 au cluster de stockage
      ansible.builtin.shell: |
        gluster peer status | grep -q 'Hostname: {{ item }}' || gluster peer probe {{ item }}
      loop: [hci2-st, hci3-st]
      changed_when: false

    - name: Attendre que les 2 pairs soient connectÃ©s
      ansible.builtin.shell: gluster peer status | grep -c 'Peer in Cluster (Connected)'
      register: peers
      until: peers.stdout | int == 2
      retries: 10
      delay: 3
      changed_when: false
      failed_when: false

    - name: CrÃ©er le volume replica 3 (si absent)
      ansible.builtin.shell: |
        gluster volume info {{ gluster_volume }} >/dev/null 2>&1 || \
        gluster volume create {{ gluster_volume }} replica 3 \
          hci1-st:{{ brick_mount }}/{{ gluster_volume }} \
          hci2-st:{{ brick_mount }}/{{ gluster_volume }} \
          hci3-st:{{ brick_mount }}/{{ gluster_volume }} force
      changed_when: false

    - name: DÃ©marrer le volume (si pas dÃ©jÃ  dÃ©marrÃ©)
      ansible.builtin.shell: |
        gluster volume info {{ gluster_volume }} | grep -q 'Status: Started' || \
        gluster volume start {{ gluster_volume }}
      changed_when: false

    - name: Profil d'options pour disques de VM
      ansible.builtin.command: gluster volume set {{ gluster_volume }} group virt
      changed_when: false

- name: hci1 doit Ãªtre connu par son nom depuis hci2
  hosts: hci2
  become: true
  tags: [gluster]
  tasks:
    - name: peer probe de hci1-st
      ansible.builtin.command: gluster peer probe hci1-st
      changed_when: false

# ============ PLAY 4 : montage, image de base, hcictl ============
- name: Monter le volume, prÃ©parer l'image et installer hcictl
  hosts: hci
  become: true
  tags: [pool]
  tasks:
    - name: Monter le volume distribuÃ© dans le dossier d'images libvirt
      ansible.posix.mount:
        path: "{{ pool_path }}"
        src: "{{ inventory_hostname }}-st:/{{ gluster_volume }}"
        fstype: glusterfs
        opts: "defaults,_netdev,backup-volfile-servers={{ groups['hci'] | difference([inventory_hostname]) | map('regex_replace', '$', '-st') | join(':') }}"
        state: mounted

    - name: Droits et sous-dossiers (volume partagÃ©, une seule fois)
      ansible.builtin.file:
        path: "{{ pool_path }}/{{ item }}"
        state: directory
        owner: libvirt-qemu
        group: libvirt
        mode: "2775"
      loop: ["", base, disks, seeds, xml, placement, ha]
      run_once: true

    - name: Image cloud Ubuntu 24.04 vÃ©rifiÃ©e par SHA256
      ansible.builtin.get_url:
        url: "{{ base_image_url }}"
        dest: "{{ pool_path }}/base/noble-server-cloudimg-amd64.img"
        checksum: "sha256:https://cloud-images.ubuntu.com/noble/current/SHA256SUMS"
        mode: "0644"
        timeout: 120
      run_once: true

    - name: Installer hcictl et son template cloud-init
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - {src: files/hcictl, dest: /usr/local/bin/hcictl, mode: "0755"}
        - {src: files/user-data.tpl, dest: /etc/hcictl-user-data.tpl, mode: "0644"}

    - name: Configuration de hcictl
      ansible.builtin.template:
        src: templates/hcictl.conf.j2
        dest: /etc/hcictl.conf
        mode: "0644"
